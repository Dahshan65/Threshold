name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'Threshold.apk' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the web app into the Android project
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Put the APK on the website
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Threshold.apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Threshold.apk
          git commit -m "Update Threshold.apk [skip ci]" || echo "No changes"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Threshold-APK
          path: Threshold.apk
