name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'Threshold.apk' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find project folder
        run: |
          ROOT=$(dirname "$(find . -path ./node_modules -prune -o -name settings.gradle -path '*android*' -print | head -n 1)")
          ROOT=$(dirname "$ROOT")
          echo "Project root: $ROOT"
          ls -la "$ROOT"
          test -f "$ROOT/index.html" || { echo "index.html not found next to the android folder"; exit 1; }
          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Copy the web app into the Android project
        run: |
          mkdir -p "$ROOT/android/app/src/main/assets"
          cp "$ROOT/index.html" "$ROOT/android/app/src/main/assets/"
          ls -la "$ROOT/android/app/src/main/assets"

      - name: Build APK
        working-directory: ${{ env.ROOT }}/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: cp "$ROOT/android/app/build/outputs/apk/release/app-release.apk" "$ROOT/Threshold.apk"

      - name: Upload APK (download from Actions page)
        uses: actions/upload-artifact@v5
        with:
          name: Threshold-APK
          path: ${{ env.ROOT }}/Threshold.apk

      - name: Put the APK on the website
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$ROOT/Threshold.apk"
          git commit -m "Update Threshold.apk [skip ci]" || echo "No changes"
          git push
